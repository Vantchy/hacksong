<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>房间 + 衣柜交互 Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #f4eee8;
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  body {
    width: 100vw;
    height: 100vh;
  }

  .demo-shell {
    width: 100vw;
    height: 100vh;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    border-radius: 0;
    background: #ead8c7;
    isolation: isolate;
  }

  .world {
    position: absolute;
    inset: 0;
    transform-origin: 38% 52%;
    transition:
      transform 820ms cubic-bezier(.2,.75,.2,1),
      filter 650ms ease;
    will-change: transform;
  }

  /* Click wardrobe: keep wardrobe on the left and character on the right, both fully visible. */
  .scene.is-zoomed .world {
    transform: translate(4%, 0.4%) scale(1.26);
  }

  .room-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    pointer-events: none;
  }

  .wardrobe {
    position: absolute;
    left: 17.5%;
    top: 25.5%;
    width: 25.5%;
    max-height: 63%;
    object-fit: contain;
    transform-origin: 50% 80%;
    filter: drop-shadow(0 18px 18px rgba(70, 46, 28, .10));
    cursor: zoom-in;
    user-select: none;
    transition:
      filter 220ms ease,
      transform 220ms ease,
      opacity 220ms ease;
  }

  .scene:not(.is-zoomed) .wardrobe:hover {
    transform: translateY(-3px) scale(1.015);
    filter:
      drop-shadow(0 22px 24px rgba(70, 46, 28, .16))
      drop-shadow(0 0 10px rgba(255,255,255,.55));
  }

  .scene.is-zoomed .wardrobe {
    cursor: zoom-out;
  }

  /* Same display size for male/female; character moved slightly upward. */
  .character-stage {
    position: absolute;
    left: 50%;
    top: 25.5%;
    width: 16%;
    height: 58%;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    pointer-events: none;
  }

  .character {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 8px rgba(63, 46, 36, .10));
    user-select: none;
    pointer-events: none;
    transition: opacity 180ms ease;
    z-index: 1;
  }

  .wearable-layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    object-fit: contain;
    user-select: none;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
  }

  .wearable-layer.is-visible {
    opacity: 1;
  }

  /* Clothing layer priority:
     pants < top < coat, with hat above everything. */
  .wearable-pants {
    top: 43%;
    width: 54%;
    z-index: 2;
  }

  .wearable-top {
    top: 22.5%;
    width: 72%;
    z-index: 4;
  }

  .wearable-coat {
    top: 21%;
    width: 78%;
    z-index: 5;
  }

  .wearable-hat {
    top: -1.5%;
    width: 52%;
    z-index: 6;
  }


  /* Wardrobe category controls shown only after entering wardrobe focus. */
  .wardrobe-tools {
    position: absolute;
    inset: 0;
    z-index: 18;
    pointer-events: none;
  }

  .category-menu {
    position: absolute;
    left: 1.2%;
    top: 29.5%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: translateX(-10px);
    pointer-events: none;
    transition: opacity 220ms ease, transform 220ms ease;
  }

  .scene.is-zoomed .category-menu {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .category-btn {
    width: 66px;
    height: 48px;
    padding: 0 8px;
    border: 1px solid rgba(90, 65, 48, .16);
    border-radius: 14px;
    background: rgba(255, 250, 246, .92);
    color: #5b4639;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(74, 50, 34, .10);
    backdrop-filter: blur(10px);
    transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
  }

  .category-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 9px 20px rgba(74, 50, 34, .14);
  }

  .category-btn[aria-pressed="true"] {
    background: #fff;
    box-shadow:
      0 8px 22px rgba(74, 50, 34, .15),
      inset 0 0 0 2px rgba(199, 157, 126, .30);
  }

  .item-grid-panel {
    position: absolute;
    left: 9.5%;
    top: 27.5%;
    width: clamp(360px, 31vw, 560px);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(3, auto);
    gap: 12px;
    padding: 14px;
    border: 1px solid rgba(90, 65, 48, .13);
    border-radius: 18px;
    background: rgba(255, 250, 246, .90);
    box-shadow: 0 16px 34px rgba(72, 48, 32, .13);
    backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateX(-8px) scale(.985);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .scene.is-zoomed .item-grid-panel.is-visible {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  .item-slot {
    aspect-ratio: 3 / 4;
    min-width: 0;
    border: 1px solid rgba(104, 80, 62, .15);
    border-radius: 16px;
    background: rgba(255, 255, 255, .72);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
  }

  .item-slot.item-slot--filled {
    position: relative;
    display: grid;
    place-items: center;
    padding: 7px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
  }

  .item-slot.item-slot--filled:hover {
    transform: translateY(-2px);
    border-color: rgba(126, 96, 75, .38);
    box-shadow: 0 8px 18px rgba(72, 48, 32, .10);
  }

  .item-slot.item-slot--filled.is-selected {
    border-color: rgba(151, 109, 78, .58);
    box-shadow:
      0 9px 22px rgba(72, 48, 32, .13),
      inset 0 0 0 2px rgba(206, 165, 133, .34);
    background: rgba(255,255,255,.94);
  }

  .item-thumb {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }

  .item-slot.add-slot {
    display: grid;
    place-items: center;
    border: 2px dashed rgba(126, 96, 75, .38);
    background: rgba(255, 255, 255, .52);
    color: rgba(99, 73, 56, .62);
    font-size: clamp(28px, 2.5vw, 40px);
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
  }

  .item-slot.add-slot:hover {
    background: rgba(255, 255, 255, .84);
    border-color: rgba(126, 96, 75, .55);
  }


  .selection-actions {
    position: absolute;
    left: 9.5%;
    top: calc(27.5% + clamp(360px, 31vw, 560px) + 12px);
    width: clamp(360px, 31vw, 560px);
    display: flex;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
  }

  .scene.is-zoomed .selection-actions.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .selection-action-btn {
    min-width: 108px;
    height: 44px;
    border-radius: 14px;
    border: 1px solid rgba(90,65,48,.16);
    background: rgba(255,250,246,.94);
    color: #5b4639;
    font: inherit;
    font-size: 14px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(72,48,32,.10);
  }

  .selection-action-btn.confirm {
    background: #fff;
    box-shadow:
      0 8px 20px rgba(72,48,32,.12),
      inset 0 0 0 2px rgba(199,157,126,.22);
  }

  .profile-preview {
    position: absolute;
    left: 66%;
    top: 27.5%;
    width: min(27vw, 430px);
    opacity: 0;
    transform: translateX(10px);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .scene.is-zoomed .profile-preview.is-visible {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .profile-window {
    min-height: 250px;
    padding: 20px 22px;
    border: 1px solid rgba(90,65,48,.14);
    border-radius: 20px;
    background: rgba(255,250,246,.92);
    box-shadow: 0 18px 38px rgba(72,48,32,.13);
    backdrop-filter: blur(12px);
  }

  .profile-window-title {
    margin: 0 0 14px;
    color: #4b392f;
    font-size: 20px;
    font-weight: 800;
  }

  .profile-window-content {
    min-height: 150px;
    color: #765f50;
    font-size: 14px;
    line-height: 1.75;
    outline: none;
    white-space: pre-line;
  }

  .profile-window-content[contenteditable="true"] {
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.72);
    box-shadow: inset 0 0 0 1px rgba(110,82,63,.15);
  }

  .profile-edit-btn {
    display: block;
    min-width: 112px;
    height: 44px;
    margin: 12px auto 0;
    border: 1px solid rgba(90,65,48,.16);
    border-radius: 14px;
    background: rgba(255,250,246,.94);
    color: #5b4639;
    font: inherit;
    font-size: 14px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(72,48,32,.10);
  }

  .topbar {
    position: absolute;
    z-index: 20;
    top: 18px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gender-switch {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-width: 196px;
    padding: 5px;
    border: 1px solid rgba(73, 51, 38, .12);
    border-radius: 999px;
    background: rgba(255, 250, 246, .88);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(71, 49, 35, .10);
  }

  .gender-switch::before {
    content: "";
    position: absolute;
    top: 5px;
    bottom: 5px;
    left: 5px;
    width: calc(50% - 5px);
    border-radius: 999px;
    background: white;
    box-shadow: 0 3px 12px rgba(80, 56, 42, .12);
    transform: translateX(0);
    transition: transform 240ms cubic-bezier(.2,.8,.2,1);
  }

  .gender-switch[data-gender="female"]::before {
    transform: translateX(100%);
  }

  .gender-btn {
    position: relative;
    z-index: 1;
    border: 0;
    background: transparent;
    min-height: 38px;
    padding: 0 15px;
    border-radius: 999px;
    color: #725d4f;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: color 180ms ease;
  }

  .gender-btn[aria-pressed="true"] {
    color: #34271f;
  }


  .hint {
    position: absolute;
    z-index: 20;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(44, 34, 28, .62);
    color: rgba(255,255,255,.94);
    font-size: 13px;
    letter-spacing: .02em;
    backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 180ms ease;
  }

  .scene.is-zoomed .hint {
    opacity: 0;
  }

  @media (max-width: 760px) {
    .wardrobe {
      left: 16%;
      top: 27%;
      width: 29%;
      max-height: 58%;
    }

    .character-stage {
      top: 27%;
      width: 20%;
      height: 50%;
    }


    .category-menu {
      left: 10px;
      top: 26%;
      gap: 8px;
    }

    .category-btn {
      width: 58px;
      height: 42px;
      border-radius: 12px;
      font-size: 12px;
    }

    .item-grid-panel {
      left: 82px;
      top: 25%;
      width: min(330px, 66vw);
      gap: 8px;
      padding: 10px;
      border-radius: 14px;
    }


    .selection-actions {
      left: 82px;
      top: calc(25% + min(330px, 66vw) + 8px);
      width: min(330px, 66vw);
      gap: 8px;
    }

    .selection-action-btn {
      min-width: 82px;
      height: 38px;
      font-size: 12px;
    }

    .profile-preview {
      left: auto;
      right: 10px;
      top: 58%;
      width: min(300px, 58vw);
    }

    .profile-window {
      min-height: 150px;
      padding: 14px;
      border-radius: 15px;
    }

    .profile-window-title {
      margin-bottom: 8px;
      font-size: 16px;
    }

    .profile-window-content {
      min-height: 80px;
      font-size: 12px;
    }

    .profile-edit-btn {
      min-width: 88px;
      height: 38px;
      margin-top: 8px;
      font-size: 12px;
    }

    .gender-switch {
      min-width: 152px;
    }

    .gender-btn {
      min-height: 34px;
      padding-inline: 10px;
      font-size: 13px;
    }

    .topbar {
      top: 10px;
      right: 10px;
    }

    .hint {
      display: none;
    }

    .scene.is-zoomed .world {
      transform: translate(5%, 0.4%) scale(1.18);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .world, .wardrobe, .character, .gender-switch::before {
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body>
  <main class="demo-shell">
    <section class="scene" id="scene" aria-label="Interactive bedroom wardrobe scene">
      <div class="world" id="world">
        <img class="room-bg" src="assets/room.png" alt="" draggable="false" />
        <img class="wardrobe" id="wardrobe" src="assets/wardrobe_male.png" alt="男生衣柜，点击放大查看" draggable="false" />
        <div class="character-stage" id="characterStage">
          <img class="character" id="character" src="assets/character_male.png" alt="男生角色" draggable="false" />
          <img class="wearable-layer wearable-pants" id="wearable-pants" alt="" draggable="false" />
          <img class="wearable-layer wearable-top" id="wearable-top" alt="" draggable="false" />
          <img class="wearable-layer wearable-coat" id="wearable-coat" alt="" draggable="false" />
          <img class="wearable-layer wearable-hat" id="wearable-hat" alt="" draggable="false" />
        </div>
      </div>

      <div class="wardrobe-tools" id="wardrobeTools" aria-label="衣柜分类">
        <div class="category-menu" id="categoryMenu">
          <button class="category-btn" type="button" data-category="hat" aria-pressed="false">帽子</button>
          <button class="category-btn" type="button" data-category="top" aria-pressed="false">上衣</button>
          <button class="category-btn" type="button" data-category="coat" aria-pressed="false">外套</button>
          <button class="category-btn" type="button" data-category="pants" aria-pressed="false">裤子</button>
        </div>

        <div class="item-grid-panel" id="itemGridPanel" aria-label="衣物格子"></div>

        <div class="selection-actions" id="selectionActions" aria-label="衣物选择操作">
          <button class="selection-action-btn" id="cancelSelectionBtn" type="button">返回</button>
          <button class="selection-action-btn confirm" id="confirmSelectionBtn" type="button">确认</button>
        </div>

        <div class="profile-preview" id="profilePreview">
          <div class="profile-window">
            <h3 class="profile-window-title">简介</h3>
            <div class="profile-window-content" id="profileContent"></div>
          </div>
          <button class="profile-edit-btn" id="profileEditBtn" type="button">修改</button>
        </div>
      </div>

      <div class="topbar">
        <div class="gender-switch" id="genderSwitch" data-gender="male" aria-label="切换角色性别">
          <button class="gender-btn" type="button" data-gender="male" aria-pressed="true">♂ 男生</button>
          <button class="gender-btn" type="button" data-gender="female" aria-pressed="false">♀ 女生</button>
        </div>
      </div>

      <div class="hint">点击左侧衣柜查看</div>
    </section>
  </main>

<script>
  const assets = {
    male: {
      character: "assets/character_male.png",
      wardrobe: "assets/wardrobe_male.png",
      altCharacter: "男生角色",
      altWardrobe: "男生衣柜，点击放大查看"
    },
    female: {
      character: "assets/character_female.png",
      wardrobe: "assets/wardrobe_female.png",
      altCharacter: "女生角色",
      altWardrobe: "女生衣柜，点击放大查看"
    }
  };

  const clothingAssets = {
    pants: {
      label: "裤子",
      src: "assets/clothing_pants.png",
      description: "浅绿色长裤。当前可在人物身上预览，确认后保存。"
    },
    coat: {
      label: "外套",
      src: "assets/clothing_coat.png",
      description: "米白色针织开衫外套。外套图层位于上衣和裤子之上。"
    },
    top: {
      label: "上衣",
      src: "assets/clothing_top.png",
      description: "浅蓝色长袖衬衫。上衣图层位于裤子之上。"
    },
    hat: {
      label: "帽子",
      src: "assets/clothing_hat.png",
      description: "米色渔夫帽。帽子会自动定位到人物头部。"
    }
  };

  const scene = document.getElementById("scene");
  const wardrobe = document.getElementById("wardrobe");
  const character = document.getElementById("character");
  const switcher = document.getElementById("genderSwitch");
  const buttons = [...document.querySelectorAll(".gender-btn")];
  const categoryButtons = [...document.querySelectorAll(".category-btn")];
  const itemGridPanel = document.getElementById("itemGridPanel");
  const selectionActions = document.getElementById("selectionActions");
  const cancelSelectionBtn = document.getElementById("cancelSelectionBtn");
  const confirmSelectionBtn = document.getElementById("confirmSelectionBtn");
  const profilePreview = document.getElementById("profilePreview");
  const profileContent = document.getElementById("profileContent");
  const profileEditBtn = document.getElementById("profileEditBtn");

  const wearableLayers = {
    pants: document.getElementById("wearable-pants"),
    top: document.getElementById("wearable-top"),
    coat: document.getElementById("wearable-coat"),
    hat: document.getElementById("wearable-hat")
  };

  const savedOutfits = {
    pants: null,
    top: null,
    coat: null,
    hat: null
  };

  let activeCategory = null;
  let previewState = null;

  function setGender(gender) {
    const next = assets[gender];
    switcher.dataset.gender = gender;

    wardrobe.style.opacity = "0";
    character.style.opacity = "0";

    setTimeout(() => {
      wardrobe.src = next.wardrobe;
      wardrobe.alt = next.altWardrobe;
      character.src = next.character;
      character.alt = next.altCharacter;

      buttons.forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.gender === gender));
      });

      requestAnimationFrame(() => {
        wardrobe.style.opacity = "1";
        character.style.opacity = "1";
      });
    }, 120);
  }

  buttons.forEach(btn => {
    btn.addEventListener("click", () => setGender(btn.dataset.gender));
  });

  function setWearable(category, src) {
    const layer = wearableLayers[category];
    if (!layer) return;

    if (src) {
      layer.src = src;
      layer.classList.add("is-visible");
    } else {
      layer.removeAttribute("src");
      layer.classList.remove("is-visible");
    }
  }

  function restoreSavedWearable(category) {
    setWearable(category, savedOutfits[category]);
  }

  function clearSelectionUI() {
    itemGridPanel
      .querySelectorAll(".item-slot--filled.is-selected")
      .forEach(slot => slot.classList.remove("is-selected"));
    selectionActions.classList.remove("is-visible");
    profilePreview.classList.remove("is-visible");
    profileContent.removeAttribute("contenteditable");
    profileEditBtn.textContent = "修改";
  }

  function cancelPreview() {
    if (!previewState) {
      clearSelectionUI();
      return;
    }

    restoreSavedWearable(previewState.category);
    previewState = null;
    clearSelectionUI();
  }

  function confirmPreview() {
    if (!previewState) return;

    savedOutfits[previewState.category] = previewState.src;
    setWearable(previewState.category, previewState.src);
    previewState = null;
    clearSelectionUI();
  }

  function beginPreview(category, slot) {
    if (previewState) cancelPreview();

    const item = clothingAssets[category];
    if (!item) return;

    previewState = {
      category,
      src: item.src
    };

    setWearable(category, item.src);

    itemGridPanel
      .querySelectorAll(".item-slot--filled")
      .forEach(other => other.classList.remove("is-selected"));
    slot.classList.add("is-selected");

    profileContent.textContent =
      `衣物分类：${item.label}\n${item.description}`;
    selectionActions.classList.add("is-visible");
    profilePreview.classList.add("is-visible");
  }

  function renderItemGrid(category) {
    activeCategory = category;
    const item = clothingAssets[category];

    itemGridPanel.innerHTML = "";

    // Slot 1: current example clothing image.
    const clothingSlot = document.createElement("button");
    clothingSlot.type = "button";
    clothingSlot.className = "item-slot item-slot--filled";
    clothingSlot.setAttribute("aria-label", `${item.label}衣物`);
    clothingSlot.innerHTML = `<img class="item-thumb" src="${item.src}" alt="${item.label}" draggable="false" />`;
    clothingSlot.addEventListener("click", (event) => {
      event.stopPropagation();
      beginPreview(category, clothingSlot);
    });
    itemGridPanel.appendChild(clothingSlot);

    // Slot 2: add button.
    const addSlot = document.createElement("button");
    addSlot.type = "button";
    addSlot.className = "item-slot add-slot";
    addSlot.setAttribute("aria-label", "添加衣物");
    addSlot.textContent = "＋";
    addSlot.addEventListener("click", event => event.stopPropagation());
    itemGridPanel.appendChild(addSlot);

    // Slots 3–12: empty placeholders.
    for (let i = 2; i < 12; i += 1) {
      const emptySlot = document.createElement("div");
      emptySlot.className = "item-slot";
      itemGridPanel.appendChild(emptySlot);
    }
  }

  function resetWardrobeTools() {
    cancelPreview();
    categoryButtons.forEach(btn => btn.setAttribute("aria-pressed", "false"));
    itemGridPanel.classList.remove("is-visible");
    activeCategory = null;
  }

  function enterWardrobeFocus() {
    scene.classList.add("is-zoomed");
    resetWardrobeTools();
  }

  function exitWardrobeFocus() {
    cancelPreview();
    scene.classList.remove("is-zoomed");
    categoryButtons.forEach(btn => btn.setAttribute("aria-pressed", "false"));
    itemGridPanel.classList.remove("is-visible");
    activeCategory = null;
  }

  wardrobe.addEventListener("click", event => {
    event.stopPropagation();
    if (!scene.classList.contains("is-zoomed")) {
      enterWardrobeFocus();
    }
  });

  categoryButtons.forEach(btn => {
    btn.addEventListener("click", event => {
      event.stopPropagation();

      if (previewState) cancelPreview();

      categoryButtons.forEach(other => {
        other.setAttribute("aria-pressed", String(other === btn));
      });

      renderItemGrid(btn.dataset.category);
      itemGridPanel.classList.add("is-visible");
    });
  });

  itemGridPanel.addEventListener("click", event => event.stopPropagation());
  selectionActions.addEventListener("click", event => event.stopPropagation());
  profilePreview.addEventListener("click", event => event.stopPropagation());
  switcher.addEventListener("click", event => event.stopPropagation());

  cancelSelectionBtn.addEventListener("click", event => {
    event.stopPropagation();
    cancelPreview();
  });

  confirmSelectionBtn.addEventListener("click", event => {
    event.stopPropagation();
    confirmPreview();
  });

  profileEditBtn.addEventListener("click", event => {
    event.stopPropagation();
    const editing = profileContent.getAttribute("contenteditable") === "true";

    if (editing) {
      profileContent.removeAttribute("contenteditable");
      profileEditBtn.textContent = "修改";
    } else {
      profileContent.setAttribute("contenteditable", "true");
      profileContent.focus();
      profileEditBtn.textContent = "完成";
    }
  });

  scene.addEventListener("click", event => {
    if (!scene.classList.contains("is-zoomed")) return;

    const clickedControl = event.target.closest(
      "#wardrobe, .wardrobe-tools, .gender-switch"
    );
    if (clickedControl) return;

    exitWardrobeFocus();
  });

  window.addEventListener("keydown", event => {
    if (event.key === "Escape" && scene.classList.contains("is-zoomed")) {
      if (previewState) {
        cancelPreview();
      } else {
        exitWardrobeFocus();
      }
    }
  });

</script>
</body>
</html>
