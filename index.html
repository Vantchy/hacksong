<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>茸学伴 · 共场陪伴</title>
<style>
  /* ============================================================
   * 茸学伴 · 成员A（样式与结构）—— 此区块由 A 全权负责
   * B 仅保留与 A 约定的 id / class 对接点，不改动样式细节
   * 对接约定（请 A 保持以下 id 与动画类名不变，B 依赖它们）：
   *   #pet 宠物节点；姿态动画类：anim-breathe / anim-sleep / anim-look / anim-stretch / anim-jump
   *   #bubble 气泡（加 .show 显示）；#petBadge 头顶挂件
   *   #stage 特效挂载点；#bar*/#val* 状态条；#level/#expText 等级经验
   * ============================================================ */
  :root {
    --bg: #F5EFE0;
    --card: #FBF7EC;
    --text: #2B2A26;
    --sub: #6B665B;
    --accent: #B8956A;
    --accent-deep: #9A7A50;
    --border: #E5DCC4;
    --shadow: 0 4px 20px rgba(120, 100, 60, 0.12);
    --good: #7C9A5A;
    --warn: #D99A4E;
    --bad: #C95B4E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 2px; font-weight: 600; }
  h1 small { display: block; font-size: 11px; color: var(--sub); letter-spacing: 4px; margin-top: 2px; font-weight: 400; }
  .lvbox { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow); }
  .lvbox em { font-style: normal; font-size: 12px; color: var(--sub); letter-spacing: 1px; }
  .lvbox b { font-size: 22px; color: var(--accent-deep); }
  .lvbox i { font-style: normal; font-size: 12px; color: var(--sub); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }

  .stage { position: relative; display: grid; place-items: center; padding: 30px 0 12px; overflow: hidden;
    border-radius: 12px; background: radial-gradient(circle at 50% 62%, #F2E8CF 0%, var(--card) 68%); }
  .pet { font-size: 86px; line-height: 1; cursor: pointer; user-select: none;
    filter: drop-shadow(0 10px 10px rgba(120, 100, 60, 0.18)); transition: transform .3s ease; }
  .pet-badge { position: absolute; top: 12px; right: 24%; font-size: 26px; pointer-events: none; }

  .bubble { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: 84%;
    background: #FFF9EC; border: 1px solid var(--border); border-radius: 14px; padding: 8px 14px;
    font-size: 13px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .bubble.show { opacity: 1; animation: bubblePop .3s ease; }
  .pop { position: absolute; bottom: 58px; font-size: 26px; pointer-events: none; animation: floatUp 1s ease-out forwards; }

  /* 姿态动画类名（A 实现，B 触发）*/
  .anim-breathe  { animation: breathe 3.2s ease-in-out infinite; }
  .anim-sleep    { animation: sleepBreath 4s ease-in-out infinite; }
  .anim-look     { animation: look .9s ease; }
  .anim-stretch  { animation: stretch 1.4s ease; }
  .anim-jump     { animation: jump .6s ease; }
  .zzz           { animation: zzz 2.4s ease-in-out infinite; }

  @keyframes breathe     { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes sleepBreath { 0%,100% { transform: scale(.94) rotate(-6deg); } 50% { transform: scale(1) rotate(-6deg); } }
  @keyframes look        { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-4deg); } }
  @keyframes stretch     { 0%,100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.1,.9) rotate(-3deg); } 60% { transform: scale(.95,1.05) rotate(3deg); } }
  @keyframes jump        { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-26px) scale(1.04); } 55% { transform: translateY(0); } 75% { transform: translateY(-10px); } }
  @keyframes zzz         { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(12px,-22px); } }
  @keyframes bubblePop   { from { transform: translateX(-50%) translateY(8px) scale(.92); } to { transform: translateX(-50%) translateY(0) scale(1); } }
  @keyframes floatUp     { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-72px) scale(1.35); } }

  .stats { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .stat { display: grid; grid-template-columns: 64px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; }
  .stat .label { color: var(--sub); letter-spacing: 1px; }
  .bar { height: 12px; background: #EFE7D2; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--good); transition: width .35s ease, background .35s ease; }
  .stat .val { text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }

  .focus-box { text-align: center; }
  .focus-time { font-size: 40px; font-weight: 700; color: var(--accent-deep); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .focus-row { display: flex; justify-content: space-around; margin: 10px 0; font-size: 13px; color: var(--sub); }
  .focus-row b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .focus-status { font-size: 13px; color: var(--sub); min-height: 20px; margin-bottom: 12px; }
  .focus-status.on { color: var(--accent-deep); font-weight: 600; }
  .focus-status.warn { color: var(--warn); font-weight: 600; }

  button { font: inherit; font-size: 14px; letter-spacing: 1px; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
    box-shadow: var(--shadow); transition: transform .1s ease, opacity .15s ease; }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #FFF9EC; font-weight: 600; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .controls button { flex: 1; min-width: 96px; }

  .mirror { display: none; }
  .mirror.show { display: block; }
  .mirror p { margin: 0 0 10px; font-size: 14px; color: var(--sub); }
  .mirror-input { display: flex; gap: 8px; }
  .mirror-input input { flex: 1; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #FFFDF6; color: var(--text); outline: none; }
  .mirror-input input:focus { border-color: var(--accent); }
  .mirror-resp { margin-top: 12px; padding: 10px 12px; background: #FFF9EC; border: 1px solid var(--border);
    border-radius: 10px; font-size: 13px; min-height: 18px; color: var(--text); display: none; }
  .mirror-resp.show { display: block; }
  .mirror-resp b { color: var(--accent-deep); }

  .record { display: none; text-align: center; }
  .record.show { display: block; }
  .record p { margin: 0 0 12px; font-size: 14px; color: var(--sub); }
  .mood-btns { display: flex; gap: 14px; justify-content: center; }
  .mood-btns button { font-size: 30px; padding: 10px 18px; line-height: 1; }

  .breathe-timer { display: none; text-align: center; }
  .breathe-timer.show { display: block; }
  .breathe-circle { width: 90px; height: 90px; margin: 6px auto 10px; border-radius: 50%;
    background: radial-gradient(circle, #D9E8C8, #B8D09A); animation: breatheCircle 8s ease-in-out infinite; }
  @keyframes breatheCircle { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.15); } }
  .breathe-text { font-size: 13px; color: var(--sub); }
  .breathe-count { font-size: 26px; font-weight: 700; color: var(--accent-deep); font-variant-numeric: tabular-nums; }

  .profile { font-size: 13px; color: var(--sub); line-height: 1.8; }
  .profile b { color: var(--text); }
  .profile .empty { color: var(--sub); font-style: italic; }

  .hint { text-align: center; font-size: 12px; color: var(--sub); margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>茸学伴<small>RONG STUDY COMPANION</small></h1>
      <div class="lvbox"><em>Lv</em><b id="level">1</b><i id="expText">经验 0/100</i></div>
    </header>

    <!-- 宠物舞台 -->
    <div class="panel">
      <div class="stage" id="stage">
        <div class="bubble" id="bubble"></div>
        <div class="pet anim-breathe" id="pet">🐱</div>
        <div class="pet-badge" id="petBadge"></div>
      </div>
      <!-- 状态条（hunger/happiness/energy/hygiene/health）-->
      <div class="stats">
        <div class="stat"><span class="label">饱食度</span><span class="bar"><i id="barHunger"></i></span><span class="val" id="valHunger">80</span></div>
        <div class="stat"><span class="label">快乐度</span><span class="bar"><i id="barHappiness"></i></span><span class="val" id="valHappiness">80</span></div>
        <div class="stat"><span class="label">精力值</span><span class="bar"><i id="barEnergy"></i></span><span class="val" id="valEnergy">80</span></div>
        <div class="stat"><span class="label">清洁度</span><span class="bar"><i id="barHygiene"></i></span><span class="val" id="valHygiene">80</span></div>
        <div class="stat"><span class="label">健康值</span><span class="bar"><i id="barHealth"></i></span><span class="val" id="valHealth">80</span></div>
      </div>
    </div>

    <!-- 共场陪伴 · 专注面板 -->
    <div class="panel focus-box">
      <div class="focus-time" id="focusTimeText">00:00</div>
      <div class="focus-row">
        <span>中断 <b id="interruptCount">0</b> 次</span>
        <span>状态 <b id="focusStateText">空闲</b></span>
      </div>
      <div class="focus-status" id="focusStatus">点开启共学，茸茸就趴在屏幕边陪你</div>
      <div class="controls">
        <button class="primary" id="btnCompanion" type="button">开启共学模式</button>
        <button id="btnEndCompanion" type="button" disabled>结束本次</button>
      </div>
    </div>

    <!-- 状态镜像对话（点击宠物弹出）-->
    <div class="panel mirror" id="mirrorPanel">
      <p>现在感觉怎么样？跟茸茸说一句</p>
      <div class="mirror-input">
        <input id="moodInput" type="text" placeholder="如：好烦不想学 / 今天状态不错 / 有点焦虑" maxlength="40" />
        <button class="primary" id="btnSubmitMood" type="button">说给茸茸</button>
      </div>
      <div class="mirror-resp" id="mirrorResp"></div>
      <!-- 深呼吸倒计时启动动作 -->
      <div class="breathe-timer" id="breatheTimer">
        <div class="breathe-circle"></div>
        <div class="breathe-count" id="breatheCount">60</div>
        <div class="breathe-text">跟着圆圈呼吸 · 陪茸茸看一分钟窗外</div>
      </div>
    </div>

    <!-- 状态记录（学习结束后弹出）-->
    <div class="panel record" id="recordPanel">
      <p>本次学习结束啦，现在感觉怎么样？</p>
      <div class="mood-btns">
        <button type="button" data-mood="happy" title="不错">😊</button>
        <button type="button" data-mood="neutral" title="一般">😐</button>
        <button type="button" data-mood="sad" title="不太好">😫</button>
      </div>
    </div>

    <!-- 长期画像（模块3/4 数据入口）-->
    <div class="panel profile" id="profileSummary">
      <span class="empty">还没有学习记录 · 茸茸会慢慢了解你</span>
    </div>

    <p class="hint">点击茸茸可以说说话 · 共学时它会陪你，走神时它会看你一眼 · 不催你不骂你</p>
  </div>

<script>
/* ============================================================
 * 茸学伴 · 成员B（app.js 核心交互逻辑）—— B 全权负责本区块
 * 负责范围：按钮绑定、状态镜像对话、UI更新、动画触发、专注度检测
 * ------------------------------------------------------------
 * 【与成员A对接约定】（A 改样式时请保持以下 id / 动画类名不变）
 *   #pet 宠物节点；姿态动画类：
 *       anim-breathe（呼吸默认）/ anim-sleep（打盹·用户专注时）
 *       anim-look（抬头看一眼·走神提醒）/ anim-stretch（伸懒腰·学习结束）
 *       anim-jump（开心跳跃）
 *   #bubble 气泡（加 .show 显示）；#petBadge 头顶挂件（💤/📖/👀）
 *   #stage 特效挂载点（动态插入 span.pop）
 *   #bar*/#val* 五条状态条；#level/#expText 等级经验
 *   #focusTimeText/#interruptCount/#focusStateText/#focusStatus 专注面板
 *   #btnCompanion/#btnEndCompanion 共学按钮；#mirrorPanel/#moodInput/#btnSubmitMood/#mirrorResp 镜像对话
 *   #breatheTimer/#breatheCount 深呼吸启动动作；#recordPanel 情绪记录；#profileSummary 画像
 * ------------------------------------------------------------
 * 【与成员C对接约定】
 *   storage.save(data) / storage.load() → 存档读写（localStorage 由C实现）
 *   gameLogic.calcXpGain(minutes, interruptions) / gameLogic.checkLevelUp(state) → 算法由C实现
 *   统一字段：hunger / happiness / energy / hygiene / health（0-100）
 *             level / xp / focusTime / mood(happy|neutral|sad) / interruptions
 * ============================================================ */
(function () {
  'use strict';

  /* ============================================================
   * ▼ 成员C：storage.js Mock（仅用于 B 功能演示，正式合并由 C 替换）
   *    C 需实现真实 localStorage 读写与存档管理
   * ============================================================ */
  var storage = {
    _KEY: 'rong_companion_save',
    save: function (data) {
      try { localStorage.setItem(this._KEY, JSON.stringify(data)); } catch (e) {}
    },
    load: function () {
      try {
        var raw = localStorage.getItem(this._KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
  };

  /* ============================================================
   * ▼ 成员C：gameLogic.js Mock（仅用于 B 功能演示，正式合并由 C 替换）
   *    C 需实现真实算法：等级成长、经验计算、属性衰减、专注趋势统计
   * ============================================================ */
  var gameLogic = {
    // 每升一级所需经验：Lv1→100, Lv2→150 ...
    expNeed: function (level) { return 100 + (level - 1) * 50; },
    // 学习经验 = 分钟数 - 中断惩罚（不低于0）
    calcXpGain: function (minutes, interruptions) {
      return Math.max(0, Math.round(minutes - interruptions * 0.5));
    },
    // 升级判定（直接改动 state 并返回是否升级）
    checkLevelUp: function (state) {
      var leveled = false;
      while (state.xp >= this.expNeed(state.level)) {
        state.xp -= this.expNeed(state.level);
        state.level += 1;
        leveled = true;
      }
      return leveled;
    }
  };

  /* ============================================================
   * ▲ 以上为成员C的 Mock —— 以下是成员B 的核心交互逻辑
   * ============================================================ */

  // ---------- 常量 ----------
  var IDLE_THRESHOLD = 20;        // 走神判定阈值（秒）·演示用20s，正式建议120-300s
  var FOCUS_WARN_AT = 40 * 60;   // 专注达40分钟，宠物开始翻身（暗示该休息）
  var BREATHE_SECONDS = 60;      // 深呼吸启动动作时长

  // ---------- 状态对象（与C统一字段名）----------
  var state = {
    hunger: 80, happiness: 80, energy: 80, hygiene: 80, health: 80,
    level: 1, xp: 0,
    focusTime: 0,        // 本次专注累计秒
    interruptions: 0,    // 本次中断次数
    mood: 'neutral',     // happy | neutral | sad
    studying: false      // 是否处于共学模式
  };

  // ---------- 长期画像（模块3/4 数据，交由C持久化）----------
  var profile = {
    sessions: [],        // 每次学习记录 {date, startHour, focusMin, interruptions, mood}
    focusUpperLimit: 0,   // 发现的专注上限（分钟）
    weekdayStats: {}      // 周X下午状态统计 {1:{focusMin:0,count:0}...}
  };

  // ---------- 内部运行变量 ----------
  var remainBreathe = 0;          // 深呼吸剩余秒
  var lastActivity = Date.now(); // 最近一次鼠标/键盘活动
  var wasIdle = false;           // 当前是否已处于走神态
  var bubbleTimer = null;
  var breatheTimer = null;
  var lastFidgetWarn = 0;        // 上次翻身提醒时间（防刷屏）

  // ---------- DOM 引用（与A对接的 id）----------
  function $(id) { return document.getElementById(id); }
  var pet = $('pet'), bubble = $('bubble'), badge = $('petBadge'), stage = $('stage');
  var bars = { hunger: $('barHunger'), happiness: $('barHappiness'), energy: $('barEnergy'),
               hygiene: $('barHygiene'), health: $('barHealth') };
  var vals = { hunger: $('valHunger'), happiness: $('valHappiness'), energy: $('valEnergy'),
              hygiene: $('valHygiene'), health: $('valHealth') };
  var levelEl = $('level'), expEl = $('expText');
  var focusTimeText = $('focusTimeText'), interruptCount = $('interruptCount'),
      focusStateText = $('focusStateText'), focusStatus = $('focusStatus');
  var btnCompanion = $('btnCompanion'), btnEndCompanion = $('btnEndCompanion');
  var mirrorPanel = $('mirrorPanel'), moodInput = $('moodInput'),
      btnSubmitMood = $('btnSubmitMood'), mirrorResp = $('mirrorResp');
  var breatheTimerEl = $('breatheTimer'), breatheCount = $('breatheCount');
  var recordPanel = $('recordPanel'), profileSummary = $('profileSummary');

  // ---------- 工具 ----------
  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  /* ===== 动画（A：动画类名对接处）===== */
  var ANIMS = ['anim-breathe', 'anim-sleep', 'anim-look', 'anim-stretch', 'anim-jump'];
  function playAnim(name) {
    ANIMS.forEach(function (c) { pet.classList.remove(c); });
    void pet.offsetWidth;
    if (name) pet.classList.add(name);
  }
  function pose() {
    // 共学中：用户专注→宠物打盹；走神→抬头看一眼（一次性后回到打盹）
    if (state.studying) playAnim('anim-sleep');
    else playAnim('anim-breathe');
  }

  /* ===== 气泡 ===== */
  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, ms || 2800);
  }

  /* ===== 特效粒子 ===== */
  function pop(ch) {
    var s = document.createElement('span');
    s.className = 'pop'; s.textContent = ch;
    s.style.left = (26 + Math.random() * 48) + '%';
    stage.appendChild(s);
    setTimeout(function () { s.remove(); }, 1100);
  }

  /* ===== 宠物表情 ===== */
  function face() {
    if (state.studying) return '😴';     // 共学中打盹
    if (state.hunger < 25) return '😿';
    if (state.energy < 25) return '😪';
    if (state.happiness < 25) return '🙀';
    if (state.happiness >= 70 && state.hunger >= 60) return '😸';
    return '🐱';
  }

  /* ===== 状态条颜色 ===== */
  function barColor(v) {
    if (v >= 50) return '#7C9A5A';
    if (v >= 25) return '#D99A4E';
    return '#C95B4E';
  }

  /* ===== UI 全量更新 ===== */
  function updateUI() {
    ['hunger', 'happiness', 'energy', 'hygiene', 'health'].forEach(function (k) {
      var v = Math.round(state[k]);
      bars[k].style.width = v + '%';
      bars[k].style.background = barColor(v);
      vals[k].textContent = v;
    });
    levelEl.textContent = state.level;
    expEl.textContent = '经验 ' + state.xp + '/' + gameLogic.expNeed(state.level);

    pet.textContent = face();
    if (state.studying) { badge.textContent = '💤'; badge.classList.add('zzz'); }
    else { badge.textContent = ''; badge.classList.remove('zzz'); }

    var m = Math.floor(state.focusTime / 60);
    var s = state.focusTime % 60;
    focusTimeText.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    interruptCount.textContent = state.interruptions;

    btnCompanion.disabled = state.studying;
    btnEndCompanion.disabled = !state.studying;
  }

  /* ============================================================
   * 模块1：共场陪伴 + 走神检测（B 核心实现）
   * 技术方案：Page Visibility API + 鼠标键盘空闲检测
   * ============================================================ */

  // 开启共学模式
  function startCompanion() {
    if (state.studying) return;
    state.studying = true;
    state.focusTime = 0;
    state.interruptions = 0;
    wasIdle = false;
    lastActivity = Date.now();
    pose();
    focusStatus.textContent = '茸茸趴下了 · 你专注时它打盹，走神时它看你一眼';
    focusStatus.className = 'focus-status on';
    focusStateText.textContent = '专注中';
    say('开工啦，我趴这儿陪你');
    updateUI();
  }

  // 结束共学模式 → 触发模块3状态记录
  function endCompanion() {
    if (!state.studying) return;
    state.studying = false;
    // 宠物伸懒腰、打哈欠（学习结束反馈）
    playAnim('anim-stretch');
    badge.textContent = '';
    badge.classList.remove('zzz');
    pop('🥱');
    focusStatus.textContent = '本次结束 · 茸茸伸了个懒腰';
    focusStatus.className = 'focus-status';
    focusStateText.textContent = '空闲';
    say('辛苦啦，伸个懒腰～', 3000);

    // 记录本次会话（交由C持久化）
    recordSession();
    // 弹出情绪记录（模块3）
    showMoodRecord();
    updateUI();
    setTimeout(pose, 1500);
  }

  // 走神检测：鼠标/键盘活动重置
  function resetActivity() {
    lastActivity = Date.now();
    if (wasIdle && state.studying) {
      // 用户回来 → 宠物重新趴下打盹
      wasIdle = false;
      pose();
      focusStateText.textContent = '专注中';
      focusStatus.className = 'focus-status on';
      focusStatus.textContent = '欢迎回来 · 茸茸继续趴着陪你';
    }
  }

  // 走神判定（每秒心跳调用）
  function checkIdle() {
    if (!state.studying) return;
    var idleSec = (Date.now() - lastActivity) / 1000;
    if (idleSec >= IDLE_THRESHOLD && !wasIdle) {
      // 走神 → 宠物抬头看你一眼，继续趴下（不打扰，只提醒）
      wasIdle = true;
      playAnim('anim-look');
      badge.textContent = '👀';
      say('（看了你一眼）还在吗？', 2200);
      focusStateText.textContent = '走神了';
      focusStatus.className = 'focus-status warn';
      focusStatus.textContent = '茸茸发现你走神了 · 不催你，回来就好';
      setTimeout(function () {
        if (state.studying && wasIdle) { badge.textContent = '💤'; pose(); }
      }, 2200);
    }
  }

  // 标签页可见性 → 切走记为中断
  function onVisibilityChange() {
    if (document.hidden && state.studying) {
      state.interruptions += 1;
      focusStatus.textContent = '检测到切换页面 · 记一次中断（不打扰你）';
      focusStatus.className = 'focus-status warn';
      updateUI();
    } else if (!document.hidden && state.studying) {
      lastActivity = Date.now();
      wasIdle = false;
      focusStatus.textContent = '回来啦 · 茸茸一直在这儿';
      focusStatus.className = 'focus-status on';
      focusStateText.textContent = '专注中';
      pose();
    }
  }

  // 专注超限提醒（模块4 演化雏形：发现专注上限约45分钟，第40分钟开始翻身）
  function checkFocusLimit() {
    if (!state.studying) return;
    if (state.focusTime === FOCUS_WARN_AT && Date.now() - lastFidgetWarn > 60000) {
      lastFidgetWarn = Date.now();
      playAnim('anim-look');
      pop('🫠');
      say('坐不住了…要不歇1分钟？', 3000);
      setTimeout(function () { if (state.studying) pose(); }, 1500);
    }
  }

  /* ============================================================
   * 模块2：状态镜像对话（B 核心实现 · 规则引擎）
   * 点击宠物 → 输入状态 → 规则匹配 → 宠物回应 + 极小启动动作
   * ============================================================ */
  var DIALOGUE_RULES = [
    { keys: ['烦', '不想学', '不想', '不想动', '累', '懒', '摆烂', '学不进'],
      resp: '那先不学，陪我看一分钟窗外吧', action: 'breathe' },
    { keys: ['不错', '状态好', '可以', '精神', 'ok', '好的', '挺好', '元气'],
      resp: '好耶！那今天先做最顺手的那件事？', action: 'recommend' },
    { keys: ['焦虑', '紧张', '害怕', '担心', '压力', '慌', '怕'],
      resp: '你已经在焦虑了，说明你在乎。先写一行字就好。', action: 'blank' },
    { keys: ['困', '睡', '瞌睡', '疲惫', '犯困'],
      resp: '要不趴五分钟？我叫你。', action: 'nap' },
    { keys: ['无聊', '没意思', '枯燥', '烦闷'],
      resp: '换个学法？读出声试试。', action: 'noop' },
    { keys: ['开心', '高兴', '快乐', '耶'],
      resp: '嘿嘿，那乘着这股劲儿先开个头？', action: 'recommend' }
  ];
  var DEFAULT_RULE = { resp: '嗯，我在。先来五分钟？', action: 'noop' };

  function matchRule(text) {
    for (var i = 0; i < DIALOGUE_RULES.length; i++) {
      var r = DIALOGUE_RULES[i];
      for (var j = 0; j < r.keys.length; j++) {
        if (text.indexOf(r.keys[j]) >= 0) return r;
      }
    }
    return DEFAULT_RULE;
  }

  // 提交状态镜像对话
  function submitMood() {
    var text = (moodInput.value || '').trim();
    if (!text) { say('跟茸茸说一句嘛'); return; }
    var rule = matchRule(text);
    // 宠物回应
    mirrorResp.innerHTML = '茸茸：<b>' + rule.resp + '</b>';
    mirrorResp.classList.add('show');
    // 同步气泡 + 动画
    say(rule.resp, 3200);
    playAnim('anim-jump');
    setTimeout(pose, 650);
    // 执行极小启动动作
    runStartupAction(rule.action);
    moodInput.value = '';
  }

  // 极小启动动作
  function runStartupAction(action) {
    switch (action) {
      case 'breathe':
        // 60秒深呼吸/发呆倒计时
        startBreatheTimer();
        break;
      case 'recommend':
        // 推荐今天最简单的一项任务（演示：给一句最小启动建议）
        mirrorResp.innerHTML += '<br><span style="color:var(--sub);font-size:12px">→ 建议：挑一件5分钟能搞定的小事先做</span>';
        break;
      case 'blank':
        // 打开空白页，光标定位第一行（演示：聚焦输入框模拟）
        pop('✏️');
        setTimeout(function () {
          mirrorResp.innerHTML += '<br><span style="color:var(--sub);font-size:12px">→ 已为你准备空白，先写一行字</span>';
          moodInput.blur();
        }, 600);
        break;
      case 'nap':
        pop('💤');
        mirrorResp.innerHTML += '<br><span style="color:var(--sub);font-size:12px">→ 5分钟后叫你（演示）</span>';
        break;
      case 'noop':
      default:
        break;
    }
  }

  // 深呼吸倒计时启动动作
  function startBreatheTimer() {
    breatheTimerEl.classList.add('show');
    remainBreathe = BREATHE_SECONDS;
    breatheCount.textContent = remainBreathe;
    clearInterval(breatheTimer);
    breatheTimer = setInterval(function () {
      remainBreathe -= 1;
      breatheCount.textContent = remainBreathe;
      if (remainBreathe <= 0) {
        clearInterval(breatheTimer);
        breatheTimerEl.classList.remove('show');
        say('好啦，现在试试开始？', 3000);
        playAnim('anim-jump');
        setTimeout(pose, 650);
      }
    }, 1000);
  }

  /* ============================================================
   * 模块3：状态记录（B 核心实现）
   * 学习结束后 → 三个表情按钮 → 点击即记录 + 自动采集数据
   * ============================================================ */
  function showMoodRecord() {
    recordPanel.classList.add('show');
  }
  function hideMoodRecord() {
    recordPanel.classList.remove('show');
  }
  function recordMood(mood) {
    state.mood = mood;
    var faceCh = mood === 'happy' ? '😊' : (mood === 'neutral' ? '😐' : '😫');
    // 记入本次会话（sessions 最后一项）
    var last = profile.sessions[profile.sessions.length - 1];
    if (last) last.mood = mood;
    // 保存画像（交C持久化）
    persistProfile();
    hideMoodRecord();
    pop(faceCh);
    say(mood === 'happy' ? '收到啦，记下了 😊' :
        mood === 'neutral' ? '嗯，记下了，辛苦了' : '抱抱，明天会好一点', 3000);
    renderProfile();
  }

  // 记录一次学习会话（自动采集：专注时长、中断次数、时间段）
  function recordSession() {
    var focusMin = Math.round(state.focusTime / 60);
    if (focusMin < 1) return; // 不足1分钟不记录
    var now = new Date();
    var session = {
      date: now.toISOString().slice(0, 10),
      startHour: now.getHours(),
      focusMin: focusMin,
      interruptions: state.interruptions,
      mood: 'neutral'
    };
    profile.sessions.push(session);
    // 更新专注上限（模块4 演化数据）
    if (focusMin > profile.focusUpperLimit) profile.focusUpperLimit = focusMin;
    // 周X统计（模块4 演化数据：发现周X下午状态最差）
    var wd = now.getDay();
    if (!profile.weekdayStats[wd]) profile.weekdayStats[wd] = { focusMin: 0, count: 0 };
    profile.weekdayStats[wd].focusMin += focusMin;
    profile.weekdayStats[wd].count += 1;
    persistProfile();
  }

  /* ============================================================
   * 模块4：长期陪伴演化（B 提供数据入口与触发，加分项）
   * 演化示例：连续三天同一时间学习 → 提前等候；
   *          周二下午状态最差 → 主动问候；专注上限 → 第40分钟翻身
   * ============================================================ */
  function renderProfile() {
    if (profile.sessions.length === 0) {
      profileSummary.innerHTML = '<span class="empty">还没有学习记录 · 茸茸会慢慢了解你</span>';
      return;
    }
    // 计算画像维度
    var total = profile.sessions.length;
    var totalFocus = profile.sessions.reduce(function (s, x) { return s + x.focusMin; }, 0);
    var avgFocus = Math.round(totalFocus / total);
    // 哪个时间段专注最长
    var hourBuckets = {};
    profile.sessions.forEach(function (s) {
      var key = Math.floor(s.startHour / 6) * 6; // 0/6/12/18 段
      if (!hourBuckets[key]) hourBuckets[key] = { focusMin: 0, count: 0 };
      hourBuckets[key].focusMin += s.focusMin;
      hourBuckets[key].count += 1;
    });
    var bestHour = null, bestMin = 0;
    Object.keys(hourBuckets).forEach(function (k) {
      if (hourBuckets[k].focusMin > bestMin) { bestMin = hourBuckets[k].focusMin; bestHour = k; }
    });
    var hourLabel = bestHour === null ? '—' :
      (bestHour == 0 ? '深夜' : bestHour == 6 ? '上午' : bestHour == 12 ? '下午' : '晚上');
    // 哪种情绪启动最快（演示：按mood统计平均专注）
    var moodBuckets = { happy: [], neutral: [], sad: [] };
    profile.sessions.forEach(function (s) { if (moodBuckets[s.mood]) moodBuckets[s.mood].push(s.focusMin); });
    var bestMood = '—', bestMoodAvg = 0;
    Object.keys(moodBuckets).forEach(function (k) {
      var arr = moodBuckets[k];
      if (arr.length === 0) return;
      var avg = arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
      if (avg > bestMoodAvg) { bestMoodAvg = avg; bestMood = k; }
    });
    var moodLabel = bestMood === 'happy' ? '开心' : bestMood === 'neutral' ? '平静' : bestMood === 'sad' ? '低落' : '—';

    profileSummary.innerHTML =
      '已陪伴 <b>' + total + '</b> 次 · 累计 <b>' + totalFocus + '</b> 分钟<br>' +
      '平均专注 <b>' + avgFocus + '</b> 分钟 · 上限 <b>' + profile.focusUpperLimit + '</b> 分钟<br>' +
      '最专注时段：<b>' + hourLabel + '</b> · 启动最快情绪：<b>' + moodLabel + '</b>';
  }

  // 演化：连续三天同一时段学习 → 提前等候问候（启动时触发）
  function checkEvolution() {
    if (profile.sessions.length < 3) return;
    var now = new Date();
    var hour = now.getHours();
    // 最近3次是否都在当前时段(±1小时)
    var recent = profile.sessions.slice(-3);
    var sameTime = recent.every(function (s) { return Math.abs(s.startHour - hour) <= 1; });
    if (sameTime) {
      setTimeout(function () {
        say('你又在这个时候来啦，茸茸早等着你了', 3500);
      }, 800);
      return;
    }
    // 周二下午状态最差 → 主动问候
    var tue = profile.weekdayStats[2];
    if (tue && tue.count >= 2 && now.getDay() === 2 && now.getHours() >= 12 && now.getHours() < 14) {
      setTimeout(function () {
        say('下午要不要换个地方学？', 3500);
      }, 800);
    }
  }

  /* ============================================================
   * 存档（交C实现，B 仅调用 storage 接口）
   * ============================================================ */
  function persistProfile() {
    storage.save({ state: state, profile: profile });
  }
  function loadAll() {
    var data = storage.load();
    if (data) {
      if (data.state) Object.assign(state, data.state);
      if (data.profile) Object.assign(profile, data.profile);
    }
  }

  /* ============================================================
   * 世界心跳：每秒驱动衰减 + 专注计时 + 走神检测
   * ============================================================ */
  setInterval(function () {
    // 状态衰减（演示速率，正式由C实现）
    if (state.studying) {
      state.hunger = clamp(state.hunger - 2 / 60);
      state.energy = clamp(state.energy - 1.5 / 60);
      state.happiness = clamp(state.happiness - 1 / 60);
      state.hygiene = clamp(state.hygiene - 0.8 / 60);
      state.focusTime += 1;
    } else {
      state.hunger = clamp(state.hunger - 1.2 / 60);
      state.energy = clamp(state.energy - 0.6 / 60);
      state.happiness = clamp(state.happiness - 0.8 / 60);
      state.hygiene = clamp(state.hygiene - 0.5 / 60);
    }
    // 健康值随其它状态联动
    state.health = clamp((state.hunger + state.energy + state.happiness + state.hygiene) / 4);

    checkIdle();
    checkFocusLimit();
    updateUI();
  }, 1000);

  /* ============================================================
   * 事件绑定（B 核心：按钮绑定）
   * ============================================================ */
  btnCompanion.addEventListener('click', startCompanion);
  btnEndCompanion.addEventListener('click', endCompanion);
  btnSubmitMood.addEventListener('click', submitMood);
  moodInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitMood();
  });

  // 点击宠物 → 弹出状态镜像对话
  pet.addEventListener('click', function () {
    mirrorPanel.classList.toggle('show');
    if (mirrorPanel.classList.contains('show')) {
      setTimeout(function () { moodInput.focus(); }, 100);
      playAnim('anim-jump');
      setTimeout(pose, 650);
      say('现在感觉怎么样？', 2200);
    }
  });

  // 情绪记录按钮
  recordPanel.querySelectorAll('.mood-btns button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      recordMood(btn.getAttribute('data-mood'));
    });
  });

  // 走神检测：鼠标/键盘活动
  ['mousemove', 'keydown', 'click', 'scroll'].forEach(function (evt) {
    document.addEventListener(evt, resetActivity, { passive: true });
  });
  // 标签页可见性
  document.addEventListener('visibilitychange', onVisibilityChange);

  // 存档（交C实现真实持久化，B 仅触发）
  window.addEventListener('beforeunload', persistProfile);

  /* ============================================================
   * 启动
   * ============================================================ */
  loadAll();
  updateUI();
  pose();
  renderProfile();
  setTimeout(function () {
    say('嗨，我是茸茸，今天一起学吧', 3500);
  }, 600);
  checkEvolution();
})();
</script>
</body>
</html>
